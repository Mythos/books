services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
            - vendor:/var/www/html/vendor
        depends_on:
            mariadb:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - books

    web:
        image: nginx:1.29.3-alpine@sha256:b3c656d55d7ad751196f21b7fd2e8d4da9cb430e32f646adcf92441b72f82b14
        ports:
            - "${APP_FORWARD_PORT:-8080}:80"
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - books

    mariadb:
        image: mariadb:11.8.9@sha256:79d59758afc91b89b120b0a8904d637f5a3b3e1c4900f29b740d6d46c72fef68
        ports:
            - "${DB_FORWARD_PORT:-3306}:3306"
        environment:
            MARIADB_DATABASE: ${DB_DATABASE:-books}
            MARIADB_USER: ${DB_USERNAME:-books}
            MARIADB_PASSWORD: ${DB_PASSWORD:-books}
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
        volumes:
            - mariadb_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$$MARIADB_USER -p$$MARIADB_PASSWORD --silent"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - books

    redis:
        image: redis:8.2.10-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
        ports:
            - "${REDIS_FORWARD_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - books

    mailpit:
        image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
        ports:
            - "${MAILPIT_SMTP_FORWARD_PORT:-1025}:1025"
            - "${MAILPIT_DASHBOARD_FORWARD_PORT:-8025}:8025"
        networks:
            - books

    node:
        image: node:24.21.0-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
        profiles:
            - assets
        working_dir: /var/www/html
        command: sh -c "corepack enable pnpm && (test -d node_modules/vite || pnpm install --frozen-lockfile) && pnpm run watch-poll"
        volumes:
            - ./:/var/www/html
            - node_modules:/var/www/html/node_modules
        networks:
            - books

networks:
    books:
        driver: bridge

volumes:
    vendor:
    mariadb_data:
    redis_data:
    node_modules:
