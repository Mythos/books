services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
            - vendor:/var/www/html/vendor
        depends_on:
            mariadb:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - books

    web:
        image: nginx:1.31.8-alpine@sha256:1ef7ca94d7879df82421428ce13bd1eaa412404953859cf7a5b6512c25e67a60
        ports:
            - "${APP_FORWARD_PORT:-8080}:80"
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - books

    mariadb:
        image: mariadb:13.0.2@sha256:f4054da26e3a9dd6c8b5cc97363e544408b15c0fb369d7359c25dc04826eb6e1
        ports:
            - "${DB_FORWARD_PORT:-3306}:3306"
        environment:
            MARIADB_AUTO_UPGRADE: "1"
            MARIADB_DATABASE: ${DB_DATABASE:-books}
            MARIADB_USER: ${DB_USERNAME:-books}
            MARIADB_PASSWORD: ${DB_PASSWORD:-books}
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
        volumes:
            - mariadb_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$$MARIADB_USER -p$$MARIADB_PASSWORD --silent"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - books

    redis:
        image: redis:8.10.3-alpine@sha256:896f241f438ab6a210cfb24f573b84bea721a4cbe67f1b4fd07eb638b3b02a7b
        ports:
            - "${REDIS_FORWARD_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - books

    mailpit:
        image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
        ports:
            - "${MAILPIT_SMTP_FORWARD_PORT:-1025}:1025"
            - "${MAILPIT_DASHBOARD_FORWARD_PORT:-8025}:8025"
        networks:
            - books

    node:
        image: node:24.22.1-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
        profiles:
            - assets
        working_dir: /var/www/html
        command: sh -c "corepack enable pnpm && (test -d node_modules/vite || pnpm install --frozen-lockfile) && pnpm run watch-poll"
        volumes:
            - ./:/var/www/html
            - node_modules:/var/www/html/node_modules
        networks:
            - books

networks:
    books:
        driver: bridge

volumes:
    vendor:
    mariadb_data:
    redis_data:
    node_modules:
