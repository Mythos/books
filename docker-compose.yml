services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
            - vendor:/var/www/html/vendor
        depends_on:
            mariadb:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - books

    web:
        image: nginx:1.31.8-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
        ports:
            - "${APP_FORWARD_PORT:-8080}:80"
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - books

    mariadb:
        image: mariadb:13.0.2@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d
        ports:
            - "${DB_FORWARD_PORT:-3306}:3306"
        environment:
            MARIADB_AUTO_UPGRADE: "1"
            MARIADB_DATABASE: ${DB_DATABASE:-books}
            MARIADB_USER: ${DB_USERNAME:-books}
            MARIADB_PASSWORD: ${DB_PASSWORD:-books}
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
        volumes:
            - mariadb_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$$MARIADB_USER -p$$MARIADB_PASSWORD --silent"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - books

    redis:
        image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
        ports:
            - "${REDIS_FORWARD_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - books

    mailpit:
        image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
        ports:
            - "${MAILPIT_SMTP_FORWARD_PORT:-1025}:1025"
            - "${MAILPIT_DASHBOARD_FORWARD_PORT:-8025}:8025"
        networks:
            - books

    node:
        image: node:26.13.1-bookworm@sha256:b7087bc4d973034b30854b378ba107f9fab622b47514cb7e2592e41b8bab8d49
        profiles:
            - assets
        working_dir: /var/www/html
        command: sh -c "corepack enable pnpm && (test -d node_modules/vite || pnpm install --frozen-lockfile) && pnpm run watch-poll"
        volumes:
            - ./:/var/www/html
            - node_modules:/var/www/html/node_modules
        networks:
            - books

networks:
    books:
        driver: bridge

volumes:
    vendor:
    mariadb_data:
    redis_data:
    node_modules:
