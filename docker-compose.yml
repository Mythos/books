services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
            - vendor:/var/www/html/vendor
        depends_on:
            mariadb:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - books

    web:
        image: nginx:1.31.7-alpine@sha256:42c36dfd0b3503b7966771550a91521262b4750665929821abf5069715610e20
        ports:
            - "${APP_FORWARD_PORT:-8080}:80"
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - books

    mariadb:
        image: mariadb:13.0.2@sha256:0e4bb0f339feba125d1154fbacd36c16ec8518f52e44e1f82ecec7d6771caf39
        ports:
            - "${DB_FORWARD_PORT:-3306}:3306"
        environment:
            MARIADB_DATABASE: ${DB_DATABASE:-books}
            MARIADB_USER: ${DB_USERNAME:-books}
            MARIADB_PASSWORD: ${DB_PASSWORD:-books}
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
        volumes:
            - mariadb_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$$MARIADB_USER -p$$MARIADB_PASSWORD --silent"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - books

    redis:
        image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
            - "${REDIS_FORWARD_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - books

    mailpit:
        image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
        ports:
            - "${MAILPIT_SMTP_FORWARD_PORT:-1025}:1025"
            - "${MAILPIT_DASHBOARD_FORWARD_PORT:-8025}:8025"
        networks:
            - books

    node:
        image: node:24.22.0-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
        profiles:
            - assets
        working_dir: /var/www/html
        command: sh -c "corepack enable pnpm && (test -d node_modules/vite || pnpm install --frozen-lockfile) && pnpm run watch-poll"
        volumes:
            - ./:/var/www/html
            - node_modules:/var/www/html/node_modules
        networks:
            - books

networks:
    books:
        driver: bridge

volumes:
    vendor:
    mariadb_data:
    redis_data:
    node_modules:
